port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false

redis:
  address: redis:6379

keys:
  - api_key: ${LIVEKIT_API_KEY:-devkey}
    api_secret: ${LIVEKIT_API_SECRET:-devsecret}

room:
  auto_create: false
  max_participants: 100
  empty_timeout: 300
  departure_timeout: 120

logging:
  level: info
